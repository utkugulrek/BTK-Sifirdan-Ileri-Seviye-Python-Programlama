<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Popover | Without JS Prop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="w-75 mx-auto my-4">

    <a href="#" class="btn btn-primary" data-bs-toggle="popover" title="popover header" data-bs-content="some content" data-bs-placement="top">
        Toggle Popover
    </a>

    <hr class="my-4">

    <a href="#" class="btn btn-warning" data-bs-toggle="popover" title="popover header" data-bs-content="some content" data-bs-placement="bottom">
        Toggle Popover on bottom
    </a>

    <hr class="my-4">

    <a href="#" class="btn btn-warning" data-bs-toggle="popover" title="popover header" data-bs-content="some content" data-bs-placement="right">
        Toggle Popover on right
    </a>

    <hr class="my-4">

    <a href="#" class="btn btn-warning" data-bs-toggle="popover" title="popover header" data-bs-content="some content" data-bs-placement="start">
        Toggle Popover on start
    </a>

    <hr class="my-4">

    <a href="#" class="btn btn-primary" data-bs-toggle="popover" data-bs-trigger="focus" title="popover header" data-bs-content="some content" data-bs-placement="top">
        Toggle Popover Focus
    </a>

    <a href="#" class="btn btn-primary" data-bs-toggle="popover" data-bs-trigger="hover" title="popover header" data-bs-content="some content" data-bs-placement="top">
        Toggle Popover Hover
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]');
        const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl));
    </script>
</body>
</html>
