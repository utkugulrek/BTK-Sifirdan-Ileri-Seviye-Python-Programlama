<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Image & Float</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .w {
            width: 200px;
        }
    </style>
</head>
<body class="w-75 mx-auto my-4">

    <img src="25_12_Bugs_Bunny.jpg" alt="Bugs Bunny" class="rounded w">
    <img src="25_12_Bugs_Bunny.jpg" alt="Bugs Bunny" class="rounded-circle w">
    <img src="25_12_Bugs_Bunny.jpg" alt="Bugs Bunny" class="img-thumbnail w">
    <img src="25_12_Bugs_Bunny.jpg" alt="Bugs Bunny" class="img-fluid">

    <hr class="my-4">

    <img src="25_12_Bugs_Bunny.jpg" alt="Bugs Bunny" class="w d-block mx-auto">

    <hr class="my-4">

    <div class="clearfix">
        <img src="25_12_Bugs_Bunny.jpg" alt="Bugs Bunny" class="w float-start">
        <img src="25_12_Bugs_Bunny.jpg" alt="Bugs Bunny" class="w float-end">
    </div>
    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Enim tenetur culpa itaque quasi ab at iusto corporis, vitae error deserunt nesciunt alias distinctio explicabo reiciendis ea delectus odio sapiente illo.
    </p>

    <hr class="my-4">

    <div class="clearfix">
        <div class="bg-primary p-3 w-25 float-start"></div>
        <div class="bg-warning p-3 w-75 float-end"></div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
