<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="w-75 mx-auto my-4">

    <form>
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter name">
        </div>

        <div class="form-group">
            <label for="email">email</label>
            <input type="email" class="form-control" id="email" placeholder="Enter e-mail">
            <small class="form-text text-muted">Please enter correct email</small>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter password">
        </div>

        <div class="form-group">
            <label for="city">City</label>
            <select name="city" class="form-control" id="city">
                <option value="istanbul">İstanbul</option>
                <option value="sinop">Sinop</option>
                <option value="kocaeli">Kocaeli</option>
            </select>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea type="message" id="message" cols="15" rows="5" class="form-control"></textarea>
        </div>

        <div class="form-group">
            <legend>Hobbies</legend>
            <div class="form-check">
                <label class="form-check-lablel">
                    <input type="checkbox"> Running
                </label>
            </div>

            <div class="form-check">
                <label class="form-check-lablel">
                    <input type="checkbox"> Reading
                </label>
            </div>
            
            <div class="form-check">
                <label class="form-check-lablel">
                    <input type="checkbox"> Football
                </label>
            </div>
        </div>

        <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input", id="ch">
            <label class="custom-control-label" for="ch">Check</label>
        </div>

        <div class="custom-control custom-radio">
            <input type="radio" class="custom-control-input", id="rd">
            <label class="custom-control-label" for="rd">Check</label>
        </div>

        <div>
            <div class="custom-control custom-radio custom-control-inline">
                <input type="radio" class="custom-control-input", id="crd1" name="example">
                <label class="custom-control-label" for="crd1">Custom RD1</label>
            </div>

            <div class="custom-control custom-radio custom-control-inline">
                <input type="radio" class="custom-control-input", id="crd2" name="example">
                <label class="custom-control-label" for="crd2">Custom RD2</label>
            </div>
        </div>

        <div class="input-group mt-3">
            <input type="text" class="form-control">
            <div class="input-group-append">
                <span class="input-group-text" id="ig">@gmail.com</span>
            </div>
        </div>

        <div class="input-group mt-3">
            <div class="input-group-prepend">
                <span class="input-group-text" id="ig">http://</span>
            </div>
            <input type="text" class="form-control">
        </div>

        <div class="clearfix mt-4">
            <div class="w-50 float-start">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Enter name">
                </div>
            </div>

            <div class="w-50 float-start ps-2">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter password">
                </div>
            </div>
        </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
