<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Margin & Padding</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        div {
            width: 200px;
            height: 200px;
            display: inline-block;
        }

        /*
        BOOTSTRAP 5 SPACING (BOŞLUK) MANTIĞI:
        
        Sınıf Yapısı: {property}{sides}-{size}
        
        Property (Özellik):
        m -> margin (Dış Boşluk)
        p -> padding (İç Boşluk)

        Sides (Yönler):
        t -> top (Üst)
        b -> bottom (Alt)
        s -> start / left (Sol / Başlangıç)   [Eski V4: l]
        e -> end / right (Sağ / Bitiş)        [Eski V4: r]
        x -> hem left hem right (Yatay)
        y -> hem top hem bottom (Dikey)
        blank (Boş) -> 4 tarafın tümü

        Size (Boyutlar): 0, 1, 2, 3, 4, 5, auto
        */

    </style>
</head>
<body>

    <div class="bg-success ms-2">first</div>
    <div class="bg-primary mx-4">second</div>

    <div class="bg-warning p-3">third</div>
    <div class="bg-success p-4">fourth</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
