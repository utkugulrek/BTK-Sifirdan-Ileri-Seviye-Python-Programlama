<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Carousel - Slider</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        /* Carousel görsellerine sabit yükseklik verir */
        .carousel-item img {
            height: 400px;
            object-fit: contain; /* Resmin tamamını 400px içine sığdırır */
            background-color: #000; /* Resmin yanında/üstünde kalan boşlukları siyah yapar */
        }
</style>
</head>
<body class="w-75 mx-auto my-4 container">

    <div class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="25_19_madagascar_alex.png" alt="" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="25_19_madagascar_marty.png" alt="" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="25_19_madagascar_julien.png" alt="" class="d-block w-100">
            </div>
        </div>
    </div>

    <div class="carousel slide my-5" data-bs-ride="true" id="slider1">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="25_19_madagascar_alex.png" alt="Alex" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="25_19_madagascar_marty.png" alt="Marty" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="25_19_madagascar_julien.png" alt="Julien" class="d-block w-100">
            </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#slider1" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#slider1" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <div class="carousel slide carousel-fade my-5" data-bs-ride="true" id="slider2">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#slider2" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#slider2" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#slider2" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="25_19_madagascar_alex.png" alt="Alex" class="d-block w-100">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Alex</h5>
                    <p>King of New York</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="25_19_madagascar_marty.png" alt="Marty" class="d-block w-100">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Marty</h5>
                    <p>Bro of New York</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="25_19_madagascar_julien.png" alt="Julien" class="d-block w-100">
                <div class="carousel-caption  d-none d-md-block">
                    <h5>Julien</h5>
                    <p>King of Madagascar</p>
                </div>
            </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#slider2" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#slider2" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
