<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Responsive Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body  class="w-75 mx-auto my-4">

    <div class="container">
        <h2>Extra Small (&lt;576px)</h2>
        <div class="row my-4">
            <div class="col border">Column</div>
            <div class="col border">Column</div>
        </div>

        <h2>Small (&ge;576px)</h2>
        <div class="row my-4">
            <div class="col-sm-3 border">length 3</div>
            <div class="col-sm-9 border">length 9</div>
        </div>

        <h2>Medium (&ge;768px)</h2>
        <div class="row my-4">
            <div class="col-md-3 border">length 3</div>
            <div class="col-md-9 border">length 9</div>
        </div>

        <h2>Large (&ge;992px)</h2>
        <div class="row my-4">
            <div class="col-lg-3 border">length 3</div>
            <div class="col-lg-9 border">length 9</div>
        </div>

        <h2>Extra Large (&ge;1200px)</h2>
        <div class="row my-4">
            <div class="col-xl-3 border">length 3</div>
            <div class="col-xl-9 border">length 9</div>
        </div>

        <h2>Extra Extra Large (&ge;1400px)</h2>
        <div class="row my-4">
            <div class="col-xxl-3 border">length 3</div>
            <div class="col-xxl-9 border">length 9</div>
        </div>

        <h2>Flexible</h2>
        <div class="row my-4">
            <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1 border bg-primary text-white">Column</div>
            <div class="col-sm-6 col-md-8 col-lg-9 col-xl-10 col-xxl-11 border bg-warning">Column</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
