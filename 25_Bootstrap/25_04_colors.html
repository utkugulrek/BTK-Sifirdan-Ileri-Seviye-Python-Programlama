<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Renkler ve Badge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            padding: 70px;
        }
        div {
            padding: 20px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <!-- Metin Renkleri -->
    <p class="text-primary">text-primary</p>
    <p class="text-secondary">text-secondary</p>
    <p class="text-success">text-success</p>
    <p class="text-danger">text-danger</p>
    <p class="text-warning">text-warning</p>
    <p class="text-info">text-info</p>
    <p class="text-light bg-dark">text-light bg-dark</p>
    <p class="text-dark">text-dark</p>
    <p class="text-muted">text-muted</p>
    <p class="text-white bg-dark">text-white bg-dark</p>

    <hr class="my-4">

    <!-- Link Renkleri -->
    <p>
        <a href="#" class="text-danger">text-danger</a>
    </p>

    <!-- Arka Plan Renkleri -->
    <div class="bg-primary">bg-primary</div>
    <div class="bg-warning">bg-warning</div>
    <div class="bg-success">bg-success</div>

    <hr class="my-4">

    <!-- Standart Badge (Bootstrap 5 Kullanımı) -->
    <span class="badge text-bg-primary">Primary</span>
    <span class="badge text-bg-danger">Danger</span>

    <hr class="my-4">

    <!-- Oval Badge (rounded-pill Kullanımı) -->
    <span class="badge rounded-pill text-bg-primary">Primary Pill</span>
    <span class="badge rounded-pill text-bg-info">Info Pill</span>

    <hr class="my-4">

    <!-- Link Şeklinde Badge -->
    <a href="#" class="badge text-bg-dark ">Dark Link Badge</a>
    <a href="#" class="badge text-bg-secondary text-decoration-none">Secondary Link Badge Without_</a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
